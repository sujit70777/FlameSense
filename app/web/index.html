<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlameSense: fire safety insights from NASA's space-station fire experiments</title>
  <meta name="description" content="Explore NASA microgravity combustion data, predict how flames behave in orbit, on the Moon and on Mars, and learn what space fire research means for safety on Earth.">
  <meta name="theme-color" content="#0A1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">

  <!-- Open Graph / Twitter (DESIGN.md §15). No NASA marks. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FlameSense">
  <meta property="og:title" content="FlameSense: fire safety insights from NASA's space-station fire experiments">
  <meta property="og:description" content="Explore NASA microgravity combustion data, predict how flames behave in orbit, on the Moon and on Mars, and learn what space fire research means for safety on Earth.">
  <meta property="og:url" content="https://flamesense.ehsanur.com/">
  <meta property="og:image" content="https://flamesense.ehsanur.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FlameSense: fire safety insights from NASA's space-station fire experiments">
  <meta name="twitter:description" content="Explore NASA microgravity combustion data, predict how flames behave in orbit, on the Moon and on Mars, and learn what space fire research means for safety on Earth.">
  <meta name="twitter:image" content="https://flamesense.ehsanur.com/og.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FlameSense">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0A1020; }
    #fs-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0A1020;
      font: 420 14px/22px Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #A9B6CC; letter-spacing: 0.05px;
    }
    #fs-splash svg { width: 56px; height: 56px; margin-bottom: 16px; }
    #fs-splash .sphere { fill: #6CB6FF; animation: fs-pulse 1.6s ease-in-out infinite alternate; }
    #fs-splash .drop { stroke: #FF8A3D; }
    #fs-splash.light { background: #F5F7FA; color: #42506A; }
    #fs-splash.light .sphere { fill: #1F66D6; }
    #fs-splash.light .drop { stroke: #E2621B; }
    html.light, html.light body { background: #F5F7FA; }
    @keyframes fs-pulse { from { opacity: 0.6; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #fs-splash .sphere { animation: none; } }
    noscript p { color: #EAF0FA; font: 16px/26px system-ui, sans-serif; text-align: center; padding: 48px 16px; }
  </style>
</head>
<body>
  <div id="fs-splash" role="status" aria-live="polite">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <path class="drop" d="M32 5 C32 5 51 25 51 39 A19 19 0 0 1 13 39 C13 25 32 5 32 5 Z"
            fill="none" stroke-width="4" stroke-linejoin="round"/>
      <circle class="sphere" cx="32" cy="39" r="9"/>
    </svg>
    <span>Loading FlameSense</span>
  </div>
  <noscript><p>FlameSense needs JavaScript to run. Please enable it and reload the page.</p></noscript>
  <script>
    // Match the saved theme (shared_preferences key "flutter.fs.theme") so the
    // splash → app handoff is seamless in both themes.
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('flutter.fs.theme')); } catch (e) {}
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      if (saved === 'light' || (saved !== 'dark' && prefersLight)) {
        document.getElementById('fs-splash').classList.add('light');
        document.documentElement.classList.add('light');
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
